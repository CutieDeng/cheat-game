<svg viewBox="0 0 680 288" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --lumi-ink: light-dark(#000000, #e0e0e0);
      --lumi-muted: light-dark(#5f6368, #9aa0a6);
      --lumi-dim: light-dark(#f2f0f0, #242528);
      --lumi-container: light-dark(#e8e6e6, #2d2f33);
      --lumi-outline: light-dark(#727676, #9a9b9c);
      --lumi-accent-bg: light-dark(#dcf1ff, #192967);
      --lumi-primary: light-dark(#3186ff, #9dd2ff);
      --lumi-sans: 'Google Sans Flex', var(--font-family, 'Google Sans', sans-serif);
      --lumi-mono: 'Google Sans Code', ui-monospace, monospace;
    }
    text { font-weight: 400; stroke: none; }
    .t-l1 { font-family: var(--lumi-sans); font-size: 15px; fill: var(--lumi-ink); }
    .t-l2 { font-family: var(--lumi-mono); font-size: 12px; font-style: italic; fill: var(--lumi-ink); }
    .t-l4 { font-family: var(--lumi-sans); font-size: 12px; fill: var(--lumi-muted); }
    .node-step { fill: var(--lumi-dim); stroke: none; }
    .node-focal { fill: var(--lumi-accent-bg); stroke: var(--lumi-primary); stroke-width: 1.25; }
    .node-store { fill: var(--lumi-container); stroke: var(--lumi-outline); stroke-width: 1; }
    .edge-arrow { fill: none; stroke: var(--lumi-ink); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 0 4; marker-end: url(#lumi-caret); }
  </style>
  <defs>
    <marker id="lumi-caret" viewBox="0 0 10 10" refX="7.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--lumi-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="node-store" x="20" y="24" width="176" height="80" rx="40"/>
  <text class="t-l1" x="108" y="54" text-anchor="middle" dominant-baseline="central">活体世界状态</text>
  <text class="t-l4" x="108" y="76" text-anchor="middle" dominant-baseline="central">地图 · 证物 · 角色位置</text>

  <line class="edge-arrow" x1="204" y1="64" x2="244" y2="64"/>

  <rect class="node-step" x="252" y="24" width="176" height="80" rx="40"/>
  <text class="t-l1" x="340" y="54" text-anchor="middle" dominant-baseline="central">局部感知与同房总线</text>
  <text class="t-l4" x="340" y="76" text-anchor="middle" dominant-baseline="central">视线 · 听觉 · 公共发言</text>

  <line class="edge-arrow" x1="436" y1="64" x2="476" y2="64"/>

  <rect class="node-focal" x="484" y="24" width="176" height="80" rx="40"/>
  <text class="t-l1" x="572" y="54" text-anchor="middle" dominant-baseline="central">专用小模型策略核</text>
  <text class="t-l2" x="572" y="76" text-anchor="middle" dominant-baseline="central">移动 · 藏证 · 串供 · 插话</text>

  <rect class="node-step" x="20" y="188" width="176" height="80" rx="40"/>
  <text class="t-l1" x="108" y="218" text-anchor="middle" dominant-baseline="central">玩家实体介入</text>
  <text class="t-l4" x="108" y="240" text-anchor="middle" dominant-baseline="central">走动 · 窃听 · 抓现场</text>

  <line class="edge-arrow" x1="204" y1="228" x2="244" y2="228"/>

  <rect class="node-store" x="252" y="188" width="176" height="80" rx="40"/>
  <text class="t-l1" x="340" y="218" text-anchor="middle" dominant-baseline="central">物理仲裁与裁判</text>
  <text class="t-l4" x="340" y="240" text-anchor="middle" dominant-baseline="central">校验 · 抓现行 · 回写</text>

  <rect class="node-focal" x="484" y="188" width="176" height="80" rx="40"/>
  <text class="t-l1" x="572" y="218" text-anchor="middle" dominant-baseline="central">DeepSeek 教师仿真</text>
  <text class="t-l2" x="572" y="240" text-anchor="middle" dominant-baseline="central">批量自博弈 · 蒸馏训练</text>

  <path class="edge-arrow" d="M 536 112 L 536 128 Q 536 144 520 144 L 356 144 Q 340 144 340 160 L 340 180"/>
  <path class="edge-arrow" d="M 300 180 L 300 160 Q 300 144 284 144 L 124 144 Q 108 144 108 128 L 108 112"/>
  <line class="edge-arrow" x1="608" y1="180" x2="608" y2="112"/>
</svg>
